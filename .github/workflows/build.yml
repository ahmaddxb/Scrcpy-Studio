name: Build & Release Scrcpy Studio

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title (e.g., Scrcpy Studio v1.0.0)'
        required: false
        default: 'Scrcpy Studio v1.0.0'
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pillow

      - name: Build Single-File Standalone Executable (.EXE)
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") {
              $env:GITHUB_REF -replace "refs/tags/", ""
          } elseif ($env:INPUT_TAG) {
              $env:INPUT_TAG
          } else {
              "v1.0.0"
          }
          
          # Convert icon if available
          if (Test-Path "ui\assets\icon.png") {
              python -c "from PIL import Image; img = Image.open('ui/assets/icon.png'); img.save('ui/assets/icon.ico', format='ICO')"
          }

          $iconArg = if (Test-Path "ui\assets\icon.ico") { "--icon=ui\assets\icon.ico" } else { "" }
          
          # Build lightweight standalone single-file executable without bundling external binaries
          python -m PyInstaller --name="ScrcpyStudio-$ver" --onefile --noconsole --clean --noconfirm --distpath=dist --workpath=build --add-data="ui;ui" --add-data="core;core" $iconArg app.py
          
          Write-Host "Built standalone single-file EXE:"
          Get-ChildItem -Path "dist"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          files: dist/ScrcpyStudio-*.exe
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
