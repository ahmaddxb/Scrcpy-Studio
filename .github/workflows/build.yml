name: Build & Release Scrcpy Studio

on:
  push:
    tags:
      - 'v*'
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Release Version Tag (e.g., v1.0.0)'
        required: false
        default: 'v1.0.0'
      release_title:
        description: 'Release Title (e.g., Scrcpy Studio v1.0.0)'
        required: false
        default: 'Scrcpy Studio v1.0.0'
      is_prerelease:
        description: 'Mark as Pre-release'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install Python Dependencies & Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install PySide6 pyinstaller pillow

      - name: Download Official Scrcpy Runtime
        shell: pwsh
        run: |
          $release = Invoke-RestMethod -Uri "https://api.github.com/repos/Genymobile/scrcpy/releases/latest"
          $asset = $release.assets | Where-Object { $_.name -like "*win64*.zip" } | Select-Object -First 1
          Write-Host "Downloading Scrcpy: $($asset.name) from $($asset.browser_download_url)..."
          Invoke-WebRequest -Uri $asset.browser_download_url -OutFile "scrcpy_latest.zip"
          Expand-Archive -Path "scrcpy_latest.zip" -DestinationPath "temp_scrcpy"
          $inner = Get-ChildItem -Path "temp_scrcpy" -Directory | Select-Object -First 1
          Move-Item -Path $inner.FullName -Destination "scrcpy"
          Remove-Item -Path "scrcpy_latest.zip", "temp_scrcpy" -Recurse -Force
          Test-Path "scrcpy\scrcpy.exe"

      - name: Build Standalone Executable (.EXE)
        shell: pwsh
        run: |
          python -m PyInstaller --name=ScrcpyStudio --onedir --noconsole --clean --noconfirm --distpath=dist --workpath=build --add-data="ui;ui" --add-data="core;core" app.py
          
          # Bundle Scrcpy runtime into release folder
          Copy-Item -Path "scrcpy" -Destination "dist\ScrcpyStudio\scrcpy" -Recurse -Force
          
          # Initialize default config.json from template
          if (Test-Path "config.example.json") {
              Copy-Item -Path "config.example.json" -Destination "dist\ScrcpyStudio\config.json" -Force
          }
          
          # Copy Documentation
          Copy-Item -Path "README.md", "LICENSE.txt" -Destination "dist\ScrcpyStudio\" -Force

      - name: Package Release ZIP Archive
        shell: pwsh
        env:
          INPUT_TAG: ${{ github.event.inputs.tag_name }}
        run: |
          $ver = if ($env:GITHUB_REF -like "refs/tags/*") {
              $env:GITHUB_REF -replace "refs/tags/", ""
          } elseif ($env:INPUT_TAG) {
              $env:INPUT_TAG
          } else {
              "v1.0.0-beta"
          }
          $zipName = "Scrcpy-Studio-Windows-$ver.zip"
          Compress-Archive -Path "dist\ScrcpyStudio\*" -DestinationPath $zipName
          Write-Host "Created standalone release archive: $zipName"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.tag_name != '')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
          name: ${{ github.event.inputs.release_title || github.ref_name }}
          files: Scrcpy-Studio-Windows-*.zip
          draft: false
          prerelease: ${{ github.event.inputs.is_prerelease || false }}
          generate_release_notes: true
